services:
  postgres:
    image: 'postgres:latest'
    container_name: meet-service-postgres
    environment:
      - 'POSTGRES_DB=meet-service'
      - 'POSTGRES_PASSWORD=pass'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
