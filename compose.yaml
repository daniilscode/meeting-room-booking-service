services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: meet-service-postgres
    environment:
      - 'POSTGRES_DB=meet-service'
      - 'POSTGRES_PASSWORD=pass'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: 'redis:7-alpine'
    ports:
      - '6379:6379'

volumes:
  postgres-data:
